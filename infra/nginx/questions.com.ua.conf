# QuestionsHub vhost. Install to /etc/nginx/conf.d/questions.com.ua.conf.
#
# Depends on host-level pieces installed from the private infra repo (vps/nginx/):
#   /etc/nginx/conf.d/00-shared.conf                      map $connection_upgrade, real_ip, log_format cf
#   /etc/nginx/conf.d/00-default-server.conf              catch-all 444 for direct-IP / unknown Host
#   /etc/nginx/conf.d/includes/cf-origin-tls.conf         Origin CA posture + Authenticated Origin Pulls
#   /etc/nginx/conf.d/includes/security-headers.conf      HSTS, nosniff, frame-ancestors, ...
#
# TLS is a Cloudflare Origin CA certificate (15-year) — there is no certbot on this host.
# Because Authenticated Origin Pulls is on, a direct `curl --resolve` to the origin will fail the
# handshake by design. Test through a proxied Cloudflare hostname.

# Per-IP rate limits. Namespaced qh_* so AnkiLearner's zones can coexist in the http context.
limit_req_zone $remote_addr zone=qh_api_zone:10m    rate=30r/m;
limit_req_zone $remote_addr zone=qh_auth_zone:10m   rate=5r/m;
limit_req_zone $remote_addr zone=qh_manage_zone:10m rate=150r/m;

# ── Canonical host: www -> apex ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.questions.com.ua;

    ssl_certificate     /etc/ssl/cloudflare/questions.com.ua.pem;
    ssl_certificate_key /etc/ssl/cloudflare/questions.com.ua.key;
    include /etc/nginx/conf.d/includes/cf-origin-tls.conf;

    access_log off;
    return 301 https://questions.com.ua$request_uri;
}

# ── Main site ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name questions.com.ua;

    ssl_certificate     /etc/ssl/cloudflare/questions.com.ua.pem;
    ssl_certificate_key /etc/ssl/cloudflare/questions.com.ua.key;
    include /etc/nginx/conf.d/includes/cf-origin-tls.conf;
    include /etc/nginx/conf.d/includes/security-headers.conf;

    access_log /var/log/nginx/questions.com.ua.access.log cf;
    error_log  /var/log/nginx/questions.com.ua.error.log;

    # Deliberately LOOSER than the app's own 50 MB package-import limit
    # (PackageImportOptions.MaxFileSizeBytes), so oversized uploads get the app's Ukrainian
    # error message instead of a bare nginx 413. Real-world packages are ~40 MB.
    client_max_body_size 64m;
    client_body_timeout  120s;

    # ── Media served straight from disk ──────────────────────────────
    # Files are immutable: an update deletes the old name and writes a new one.
    # Path is under /srv (not a home dir) so nginx needs no home-directory traversal.
    location ^~ /media/ {
        alias /srv/questions-hub/uploads/handouts/;

        # Allow-list of media extensions; everything else 404s below. New media is limited to
        # MediaSecurityOptions (no SVG, no m4a); svg and m4a stay here for files imported before that.
        location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|webm|ogg|mp3|wav|m4a)$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Disposition "inline" always;
            # The sandbox stops script in a file opened directly (e.g. an SVG) from running on
            # the site's origin.
            add_header Content-Security-Policy "sandbox" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        return 404;
    }

    # ── Health endpoint: internal only ───────────────────────────────
    # The deploy script polls it on 127.0.0.1:8080 directly; it reports DB reachability, so
    # there is no reason to expose it to the internet.
    location = /health {
        access_log off;
        return 404;
    }

    # JSON errors produced by nginx itself on the APIs (rate limit, body size), matching the app's
    # { "error": "…" } shape. Retry-After for nginx's own 429: one rate period is enough to refill.
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"error":"Rate limit exceeded. Please retry later."}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":"Request body is too large."}';
    }

    # ── Public API — rate limited per IP ─────────────────────────────
    location /api/v1/ {
        limit_req zone=qh_api_zone burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Agent API (personal access tokens) — its own, larger per-IP budget ──
    # Longer prefix than /api/v1/, so it wins for /api/v1/manage/*.
    location /api/v1/manage/ {
        limit_req zone=qh_manage_zone burst=50 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_too_large;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Import upload (with or without the trailing slash ASP.NET routing accepts). A regex location
    # wins over the /api/v1/manage/ prefix; GET /api/v1/manage/imports/{id} does not match and
    # stays there.
    location ~ ^/api/v1/manage/imports/?$ {
        limit_req zone=qh_manage_zone burst=50 nodelay;
        limit_req_status 429;
        client_max_body_size 55m;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_too_large;

        # Stream the body to the app instead of buffering it to nginx's temp disk first: the app
        # refuses (token, scope, unfinished-job limit, budget) before reading a byte of the body.
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Agent MCP endpoint (Streamable HTTP) — same budget, no buffering for streamed responses ──
    location /mcp {
        limit_req zone=qh_manage_zone burst=50 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_too_large;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Auth endpoints — strict rate limiting ────────────────────────
    location /api/Auth/ {
        limit_req zone=qh_auth_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else -> Blazor Server ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR / WebSocket. $connection_upgrade comes from 00-shared.conf.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Blazor Server holds a circuit open for the life of the tab.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
